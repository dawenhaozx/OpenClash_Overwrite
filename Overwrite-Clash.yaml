# =========================================
#                锚点配置
# =========================================
anchor:
  # 代理提供商锚点
  BaseProvider: &BaseProvider
    type: http
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      tolerance: 20
      interval: 300
      lazy: true
      timeout: 5000
      expected-status: 204
      url: "https://cp.cloudflare.com/generate_204"
    override:
      mptcp: true
      udp: true
    path: ./proxy_provider/provider.yaml
    filter: >-
      ^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)).*$

  # 策略组类型模板
  BaseUT: &BaseUT
    type: url-test
    include-all: true
    tolerance: 20
    interval: 60
    lazy: true
    timeout: 3000
    expected-status: 204
    url: "https://cp.cloudflare.com/generate_204"

  # Fallback: &Fallback
  #   type: fallback
  #   include-all: true
  #   interval: 30
  #   url: https://cp.cloudflare.com/generate_204

  # 节点筛选正则
  # 香港
  FilterHK: &FilterHK
     filter: >-
      ^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$
  # 新加坡
  FilterSG: &FilterSG
     filter: >-
      ^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$
  # 韩国
  FilterKR: &FilterKR
     filter: >-
      ^(?=.*(?i)(韩|🇰🇷|KR|KOR|Korea|韩国|首尔|Seoul|SEL|ICN)).*$
  # 美国
  FilterUS: &FilterUS
     filter: >-
      ^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$

# 策略组代理列表模板 - 预定义的代理节点优先级排序
  # SelectAU: &SelectAU
  #   type: url-test
  #   include-all: true
  #   tolerance: 20
  #   interval: 300
  #   lazy: true
  #   timeout: 3000
  #   expected-status: 204
  #   url: "https://cp.cloudflare.com/generate_204"
  #   filter: "^((?!(直连)).)*$"

  SelectMS: &SelectMS
    type: select
    include-all: true
    proxies:
      - 香港节点
      - 美国节点
      - 韩国节点
      - 新加坡节点
      - 全球直连

  SelectMH: &SelectMH
    type: select
    proxies:
      - 手动选择
      - 香港节点
      - 美国节点
      - 韩国节点
      - 新加坡节点
      - 全球直连
      - REJECT
    use:
      - Sub-store

  SelectHK: &SelectHK
    type: select
    proxies:
      - 香港节点
      - 美国节点
      - 新加坡节点
      - 韩国节点
      - 手动选择
      - 全球直连

  SelectUS: &SelectUS
    type: select
    proxies:
      - 美国节点
      - 香港节点
      - 新加坡节点
      - 韩国节点
      - 手动选择
      - 全球直连

  SelectSG: &SelectSG
    type: select
    proxies:
      - 新加坡节点
      - 香港节点
      - 美国节点
      - 韩国节点
      - 手动选择
      - 全球直连

  SelectKR: &SelectKR
    type: select
    proxies:
      - 韩国节点
      - 香港节点
      - 美国节点
      - 新加坡节点
      - 手动选择
      - 全球直连

# 规则提供者模板
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

  class: &class
    type: http
    interval: 86400
    behavior: classical
    format: text

# =========================================
#              代理提供商
# =========================================
proxy-providers:
  Sub-store:
    <<: *BaseProvider
    url: "url"

