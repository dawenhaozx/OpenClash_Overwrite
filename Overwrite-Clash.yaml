# =========================================
#                锚点配置
# =========================================
anchor:
  # 代理提供商锚点
  BaseProvider: &BaseProvider
    type: http
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://g.cn/generate_204"
      interval: 10
    override:
      skip-cert-verify: true
      udp: true
    path: ./proxy_provider/provider.yaml
    filter: >-
      ^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)).*$

  # 策略组类型模板
  BaseUT: &BaseUT
    type: url-test
    include-all: true
    tolerance: 20
    interval: 120
    url: https://cp.cloudflare.com/generate_204

  Fallback: &Fallback
    type: fallback
    include-all: true
    interval: 30
    url: https://cp.cloudflare.com/generate_204

  # 节点筛选正则
  # 香港
  FilterHK: &FilterHK
     filter: >-
      ^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$
  # 新加坡
  FilterSG: &FilterSG
     filter: >-
      ^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$
  # O
  FilterO: &FilterO
     filter: >-
      ^(?=.*(?i)(O)).*$
  # 美国
  FilterUS: &FilterUS
     filter: >-
      ^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$

# 策略组代理列表模板 - 预定义的代理节点优先级排序
  SelectAU: &SelectAU
    type: url-test
    include-all: true
    tolerance: 20
    interval: 120
    filter: "^((?!(直连)).)*$"

  SelectMS: &SelectMS
    type: select
    include-all: true
    proxies:
      - 香港节点
      - 美国节点
      - O节点
      - 新加坡节点
      - 自动选择
      - 全球直连

  SelectMH: &SelectMH
    type: select
    proxies:
      - 手动选择
      - 香港节点
      - 美国节点
      - O节点
      - 新加坡节点
      - 自动选择
      - 全球直连
    use:
      - Sub-store

  SelectHK: &SelectHK
    type: select
    proxies:
      - 香港节点
      - 美国节点
      - 新加坡节点
      - O节点
      - 手动选择
      - 自动选择
      - 全球直连

  SelectUS: &SelectUS
    type: select
    proxies:
      - 美国节点
      - 香港节点
      - 新加坡节点
      - O节点
      - 手动选择
      - 自动选择
      - 全球直连

  SelectSG: &SelectSG
    type: select
    proxies:
      - 新加坡节点
      - 香港节点
      - 美国节点
      - O节点
      - 手动选择
      - 自动选择
      - 全球直连

  SelectO: &SelectO
    type: select
    proxies:
      - 手动选择
      - O节点
      - 香港节点
      - 美国节点
      - 新加坡节点
      - 自动选择
      - 全球直连

# 规则提供者模板
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

  class: &class
    type: http
    interval: 86400
    behavior: classical
    format: text

# =========================================
#              代理提供商
# =========================================
proxy-providers:
  Sub-store:
    <<: *BaseProvider
    url: "url"

# 策略组
# =========================================
#             策略组配置
# =========================================
proxy-groups:

  - name: 手动选择
    <<: *SelectMS
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/11111.png"

  - name: 自动选择
    <<: *SelectAU
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Flight.png"

  - name: AI服务
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/AI_bot.png"

  - name: Sony
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/TikTok.png"

  - name: Emby
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Emby.png"

  - name: 国外媒体
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Network.png"

  - name: 谷歌服务
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Google.png"

  - name: 苹果服务
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Apple_black.png"

  - name: 微软服务
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Microsoft.png"

  - name: 游戏平台
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Game.png"

  - name: Steam
    <<: *SelectO
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Steam.png"

  - name: 漏网之鱼
    <<: *SelectMH
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/match.png"

  - name: 香港节点
    <<: [*BaseUT, *FilterHK]
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Hong_Kong.png"

  - name: 美国节点
    <<: [*BaseUT, *FilterUS]
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/USA.png"

  - name: O节点
    <<: [*BaseUT, *FilterO]
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Japan.png"

  - name: 新加坡节点
    <<: [*BaseUT, *FilterSG]
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Singapore.png"

  - name: 全球直连
    type: select
    proxies:
      - DIRECT
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/DIRECT.png"
# =========================================
#                 规则配置
# =========================================
rules:
  # ── 私有地址 & 自定义名单（最高优先级）──
  - RULE-SET,private,全球直连
  - RULE-SET,private_IP,全球直连,no-resolve
  - RULE-SET,dawenhaozx_proxy,手动选择
  - RULE-SET,dawenhaozx_direct,全球直连

  # ── 国内 / CDN 直连 ──
  - RULE-SET,category-games@cn,全球直连
  - RULE-SET,Steam_CDN_Domain,全球直连
  - RULE-SET,Steam_CDN_IP,全球直连,no-resolve
  - RULE-SET,category-game-platforms-download,全球直连
  - RULE-SET,category-public-tracker,全球直连

  # ── AI 服务 ──
  - RULE-SET,category-ai,AI服务

  # ── Sony ──
  - RULE-SET,sony,Sony

  # ── Steam ──
  - RULE-SET,steam,Steam

  # ── 谷歌（域名 + IP 双覆盖）──
  - RULE-SET,google,谷歌服务
  - RULE-SET,google-ip,谷歌服务,no-resolve
  - RULE-SET,apple,苹果服务
  - RULE-SET,microsoft,微软服务

  # ── Emby ──
  - RULE-SET,category-emby,Emby
  - RULE-SET,dawenhaozx_emby,Emby

  # ── 国外媒体 ──
  - RULE-SET,category-entertainment,国外媒体
  - RULE-SET,category-games,游戏平台

  # ── 国内直连──
  - RULE-SET,cn,全球直连
  - RULE-SET,cn-ip,全球直连,no-resolve

  # ── 最终兜底 ──
  - MATCH,漏网之鱼

# =========================================
#            规则提供者
# =========================================
rule-providers:

  # 自定义
  dawenhaozx_direct:
    <<: *class
    url: "https://raw.githubusercontent.com/dawenhaozx/OpenClash_Overwrite/refs/heads/rules/direct.list"

  dawenhaozx_proxy:
    <<: *class
    url: "https://raw.githubusercontent.com/dawenhaozx/OpenClash_Overwrite/refs/heads/rules/proxy.list"

  # 私有
  private:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"

  private_IP:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"

  # 国内 CDN / 游戏直连
  category-games@cn:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games@cn.mrs"

  Steam_CDN_Domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Steam_CDN_Domain.mrs"

  Steam_CDN_IP:
    <<: *ip
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Steam_CDN_IP.mrs"

  category-game-platforms-download:
