    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-game-platforms-download.mrs"

  category-public-tracker:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-public-tracker.mrs"

  # AI
  category-ai:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"

  # Sony
  sony:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/sony.mrs"

  # Steam / 谷歌 / 微软 / 苹果
  category-games:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games.mrs"

  steam:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"

  apple:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"

  microsoft:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"

  google:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"

  google-ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"

  # Emby
  category-emby:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-emby.mrs"

  dawenhaozx_emby:
    <<: *class
    url: "https://raw.githubusercontent.com/dawenhaozx/OpenClash_Overwrite/refs/heads/rules/emby.list"

  # 国外媒体
  category-entertainment:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-entertainment.mrs"

  # 国内直连
  cn:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"

  cn-ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"

  # fakeip
  # connectivity-check:
  #   <<: *domain
  #   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/connectivity-check.mrs"

  fake_ip_filter:
    <<: *class
    url: "https://raw.githubusercontent.com/DustinWin/ShellCrash/refs/heads/dev/public/fake_ip_filter.list"

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:7874
  respect-rules: false
  fake-ip-filter-mode: rule
  nameserver:
  - dhcp://"pppoe-wan"
  - 172.16.0.1
  - 192.168.50.1
  - "[fe80::d2ef:c1ff:feea:dff7]:53"
  - 120.196.165.24
  - 211.136.192.6
  - "[2409:8057:2000:6::8]:53"
  - "[2409:8057:2000:2::8]:53"
  fake-ip-filter:
  - RULE-SET,private,real-ip
  - RULE-SET,fake_ip_filter,real-ip
  - RULE-SET,dawenhaozx_direct,real-ip
  - RULE-SET,category-games@cn,real-ip
  - RULE-SET,Steam_CDN_Domain,real-ip
  - RULE-SET,category-game-platforms-download,real-ip
  - RULE-SET,google,fake-ip
  - RULE-SET,cn,real-ip
  - MATCH,fake-ip
