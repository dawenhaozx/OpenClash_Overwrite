# =========================================
#                锚点配置
# =========================================
anchor:
  # 代理提供商锚点
  BaseProvider: &BaseProvider
    type: http
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      interval: 300
      url: "http://www.gstatic.com/generate_204"
    override:
      udp: true
      skip-cert-verify: true
    path: ./proxy_provider/provider.yaml
    filter: >-
      ^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)).*$

  # 策略组类型模板
  Fallback: &Fallback
    type: fallback
    include-all: true
    interval: 120
    url: "http://www.gstatic.com/generate_204"

  # 回落
  FilterFB: &FilterFB
     filter: "^((?!(直连)).)*$"

  SelectMS: &SelectMS
    type: select
    include-all: true
    proxies:
      - 自动回落
      - 全球直连

  SelectMH: &SelectMH
    type: select
    proxies:
      - 手动选择
      - 自动回落
      - 全球直连
      - REJECT
    use:
      - Sub-store

# 规则提供者模板
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

  class: &class
    type: http
    interval: 86400
    behavior: classical
    format: text

# =========================================
#              代理提供商
# =========================================
proxy-providers:
  Sub-store:
    <<: *BaseProvider
    url: "url"

# =========================================
#                 DNS 配置
# =========================================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # IPv6 Fake-IP 池由 OpenClash 管理，使地址池与防火墙设置一致。
  fake-ip-filter-mode: rule
  # Overwrite.conf 的 [YAML] 段会将 oc-cn-domain 移到显式规则之后、MATCH 之前。
  fake-ip-filter:
    # 保留本地域名和直连例外，显式代理名单优先于通用国内规则。
    - RULE-SET,private,real-ip
    - RULE-SET,category-public-tracker,real-ip
    - RULE-SET,dawenhaozx_proxy,fake-ip
    - RULE-SET,dawenhaozx_direct,real-ip
    - RULE-SET,Custom_Direct_Domain,real-ip
    - RULE-SET,Custom_Proxy_Domain,fake-ip

    # 国内下载、连通性探测和 STUN 使用真实地址。
    - RULE-SET,category-games@cn,real-ip
    - RULE-SET,Steam_CDN_Domain,real-ip
    - RULE-SET,category-game-platforms-download,real-ip
    - RULE-SET,connectivity-check,real-ip
    - RULE-SET,stun-extra,real-ip
    - RULE-SET,stun,real-ip
    - RULE-SET,fake_ip_filter,real-ip

    # 有明确出站策略的域名用 Fake-IP 保留域名映射。
    - RULE-SET,category-ai,fake-ip
    # - RULE-SET,sony,fake-ip
    # - RULE-SET,nintendo,fake-ip
    # - RULE-SET,steam,fake-ip
    - RULE-SET,category-entertainment,fake-ip
    - RULE-SET,google,fake-ip
    - RULE-SET,apple,fake-ip
    - RULE-SET,github,fake-ip
    # - RULE-SET,microsoft,fake-ip
    - RULE-SET,category-emby,fake-ip
    - RULE-SET,dawenhaozx_emby,fake-ip
    # - RULE-SET,speedtest,fake-ip
    # - RULE-SET,gfw,fake-ip

    # 国内域名和未识别域名都返回真实地址，上游由下方策略选择。
    - MATCH,fake-ip

# 策略组
# =========================================
#             策略组配置
# =========================================
proxy-groups:

  - name: 手动选择
    <<: *SelectMS
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/11111.png"

  - name: AI服务
    <<: *SelectMH
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/AI_bot.png"

  - name: 国外媒体
    <<: *SelectMH
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Network.png"

  - name: 漏网之鱼
    <<: *SelectMH
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/match.png"

  - name: 自动回落
    <<: [*Fallback, *FilterFB]
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/Flight.png"

  - name: 全球直连
    type: select
    proxies:
      - DIRECT
    icon: "https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/DIRECT.png"
# =========================================
#                 规则配置
# =========================================
rules:
  # ── 私有地址 & 自定义名单（最高优先级）──
  # - SRC-IP-CIDR,192.168.50.140/32,DIRECT
  # - SRC-IP-CIDR,192.168.50.239/32,DIRECT
  - RULE-SET,private,全球直连
  - RULE-SET,private_ip,全球直连,no-resolve
  - RULE-SET,category-public-tracker,全球直连
  - RULE-SET,dawenhaozx_proxy,手动选择
  - RULE-SET,dawenhaozx_direct,全球直连

  # ── 国内 / CDN 直连 ──
  - RULE-SET,Custom_Direct_Domain,全球直连
  - RULE-SET,Custom_Direct_IP,全球直连,no-resolve
  - RULE-SET,Custom_Proxy_Domain,手动选择
  - RULE-SET,Custom_Proxy_IP,手动选择,no-resolve
  - RULE-SET,category-games@cn,全球直连
  - RULE-SET,Steam_CDN_Domain,全球直连
  - RULE-SET,Steam_CDN_IP,全球直连,no-resolve
  - RULE-SET,category-game-platforms-download,全球直连

  # ── AI 服务 ──
  - RULE-SET,category-ai,AI服务

  # # ── Steam ──
  # - RULE-SET,steam,Steam

  # ── 国外媒体 ──
  - RULE-SET,category-entertainment,国外媒体

  # ── 谷歌（域名 + IP 双覆盖）──
  - RULE-SET,google,手动选择
  - RULE-SET,google-ip,手动选择,no-resolve
  - RULE-SET,apple,手动选择
  - RULE-SET,github,手动选择
  - RULE-SET,microsoft,全球直连

  # ── Emby ──
  - RULE-SET,category-emby,手动选择
  - RULE-SET,dawenhaozx_emby,手动选择

  # ── 网速测试 ──
  - RULE-SET,stun-extra,手动选择
  - RULE-SET,stun,手动选择

  # - RULE-SET,gfw,手动选择

  # ── 国内直连──
  - RULE-SET,oc-cn-domain,全球直连
  # 已知目的 IP 可匹配国内直连；只有域名时不为这条规则主动发起解析。
  - RULE-SET,cn-ip,全球直连,no-resolve

  # ── 最终兜底 ──
  - MATCH,漏网之鱼

# =========================================
#            规则提供者
# =========================================
rule-providers:

  # 自定义
  dawenhaozx_direct:
    <<: *class
    url: "https://raw.githubusercontent.com/dawenhaozx/OpenClash_Overwrite/refs/heads/rules/direct.list"

  dawenhaozx_proxy:
    <<: *class
    url: "https://raw.githubusercontent.com/dawenhaozx/OpenClash_Overwrite/refs/heads/rules/proxy.list"

  # 国内 CDN / 游戏直连 / 私有
  private:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"

  private_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"

  Custom_Direct_Domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Direct_Domain.mrs"

  Custom_Direct_IP:
    <<: *ip
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Direct_IP.mrs"

  Custom_Proxy_Domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Proxy_Domain.mrs"

  Custom_Proxy_IP:
    <<: *ip
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Proxy_IP.mrs"

  category-games@cn:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games@cn.mrs"

  Steam_CDN_Domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Steam_CDN_Domain.mrs"

  Steam_CDN_IP:
    <<: *ip
    url: "https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/rule/Steam_CDN_IP.mrs"

  category-game-platforms-download:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-game-platforms-download.mrs"

  category-public-tracker:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-public-tracker.mrs"

  # AI
  category-ai:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"

  # # Sony
  # sony:
  #   <<: *domain
  #   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/sony.mrs"

  # # nintendo
  # nintendo:
  #   <<: *domain
  #   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/nintendo.mrs"

  # Steam / 谷歌 / 微软 / 苹果

  # steam:
  #   <<: *domain
  #   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"

  apple:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"

  github:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"

  microsoft:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"

  google:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"

  google-ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"

  # gfw:
  #   <<: *domain
  #   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs"

  # Emby
  category-emby:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-emby.mrs"

  dawenhaozx_emby:
    <<: *class
    url: "https://raw.githubusercontent.com/dawenhaozx/OpenClash_Overwrite/refs/heads/rules/emby.list"

  # 国外媒体
  category-entertainment:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-entertainment.mrs"

  # # 网速测试
  # speedtest:
  #   <<: *domain
  #   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/speedtest.mrs"

  stun:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-stun.mrs"

  # 补充当前集合缺少的测试目标
  stun-extra:
    type: inline
    behavior: domain
    payload:
      - "+.stun.twilio.com"
      - stun.cloudflare.com
      - ipv4.am.i.mullvad.net
      - ipv6.am.i.mullvad.net
      - stunserver.stunprotocol.org

  # 与 OpenClash 自动注册同名，统一使用同一规则集和缓存文件。
  oc-cn-domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: ./rule_provider/oc-cn-domain.mrs

  cn-ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"

  # Fake-IP 真实地址兼容规则
  fake_ip_filter:
    <<: *domain
    url: "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/refs/heads/mihomo-ruleset/fakeip-filter.mrs"

  connectivity-check:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/connectivity-check.mrs"
